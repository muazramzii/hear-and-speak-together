name: hear_speak_together
description: "Hear & Speak Together - a bilingual speech-learning app for children."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Localization: English and Bahasa Melayu interface
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # Remembers the chosen interface language between launches
  shared_preferences: ^2.3.3

  # Speaking practice: record the child, ask for the microphone, and play the
  # target word back to them.
  record: ^5.2.0
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.0
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Secure token storage (Keystore on Android, Keychain on iOS)
  flutter_secure_storage: ^9.2.2

  # Nunito, the typeface in the design system
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
