name: Tests

# Both suites run offline and call no paid API, so CI needs no secrets -
# SPEECH_PROVIDER and AI_PROVIDER default to their mocks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Django
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hear_speak_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: hear_speak_db
        ports:
          - 5432:5432
        # Without this the test run can start before Postgres accepts
        # connections and fail for the wrong reason.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-outside-this-job
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://hear_speak_user:ci-password@localhost:5432/hear_speak_db
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SPEECH_PROVIDER: mock
      AI_PROVIDER: mock
      ENABLE_AI_FEEDBACK: "False"
      STORE_AUDIO: "False"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for model drift
        # Fails if a model was changed without a matching migration.
        run: python manage.py makemigrations --check --dry-run

      - name: System check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity=1

  mobile:
    name: Flutter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Install dependencies
        # Also regenerates the localizations, which are git-ignored.
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
